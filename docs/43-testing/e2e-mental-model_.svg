<svg viewBox="0 0 620 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="620" height="420" fill="transparent"/>

  <!-- Suite box -->
  <rect x="230" y="10" width="160" height="56" rx="10" fill="#4299e1" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="310" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Suite</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#ebf8ff">test session + cookies</text>

  <!-- Arrow: Suite → Page -->
  <line x1="280" y1="66" x2="175" y2="130" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="95" text-anchor="middle" font-size="10" fill="#718096">Goto()</text>

  <!-- Arrow: Suite → Document -->
  <line x1="340" y1="66" x2="445" y2="130" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="95" text-anchor="middle" font-size="10" fill="#718096">Get/Post()</text>

  <!-- Page box -->
  <rect x="70" y="132" width="200" height="56" rx="10" fill="#48bb78" stroke="#276749" stroke-width="1.5"/>
  <text x="170" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Page</text>
  <text x="170" y="174" text-anchor="middle" font-size="11" fill="#f0fff4">HTML response + DOM</text>

  <!-- Document box -->
  <rect x="350" y="132" width="200" height="56" rx="10" fill="#ed8936" stroke="#c05621" stroke-width="1.5"/>
  <text x="450" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Document</text>
  <text x="450" y="174" text-anchor="middle" font-size="11" fill="#fffaf0">JSON response</text>

  <!-- Arrow: Page → Form -->
  <line x1="120" y1="188" x2="90" y2="252" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="85" y="220" text-anchor="middle" font-size="10" fill="#718096">Form()</text>

  <!-- Arrow: Page → Element -->
  <line x1="170" y1="188" x2="250" y2="252" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="220" text-anchor="middle" font-size="10" fill="#718096">Find()</text>

  <!-- Arrow: Page → Scripts -->
  <line x1="220" y1="188" x2="420" y2="252" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="218" text-anchor="middle" font-size="10" fill="#718096">Scripts()</text>

  <!-- Arrow: Page → Page (self) -->
  <path d="M 70 155 Q 30 155 30 185 Q 30 210 70 210" fill="none" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="18" y="190" text-anchor="middle" font-size="10" fill="#718096">Goto()</text>

  <!-- Form box -->
  <rect x="20" y="254" width="140" height="50" rx="10" fill="#9f7aea" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="90" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Form</text>
  <text x="90" y="292" text-anchor="middle" font-size="10" fill="#faf5ff">Submit() → Page</text>

  <!-- Element box -->
  <rect x="180" y="254" width="140" height="50" rx="10" fill="#e53e3e" stroke="#9b2c2c" stroke-width="1.5"/>
  <text x="250" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Element</text>
  <text x="250" y="292" text-anchor="middle" font-size="10" fill="#fff5f5">DOM assertions</text>

  <!-- Scripts box -->
  <rect x="350" y="254" width="140" height="50" rx="10" fill="#d69e2e" stroke="#975a16" stroke-width="1.5"/>
  <text x="420" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Scripts</text>
  <text x="420" y="292" text-anchor="middle" font-size="10" fill="#fffff0">JS library checks</text>

  <!-- Document details -->
  <rect x="350" y="325" width="240" height="80" rx="8" fill="none" stroke="#ed8936" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="470" y="348" text-anchor="middle" font-size="11" fill="#c05621">dot-notation paths</text>
  <text x="470" y="365" text-anchor="middle" font-size="11" fill="#c05621">HasField, FieldEquals</text>
  <text x="470" y="382" text-anchor="middle" font-size="11" fill="#c05621">FieldContains, FieldLen</text>
  <text x="470" y="399" text-anchor="middle" font-size="11" fill="#c05621">JSON into struct</text>

  <!-- Page assertions detail -->
  <rect x="20" y="325" width="240" height="80" rx="8" fill="none" stroke="#48bb78" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="140" y="348" text-anchor="middle" font-size="11" fill="#276749">IsOK, IsPath, Contains</text>
  <text x="140" y="365" text-anchor="middle" font-size="11" fill="#276749">HasCookie, HasQueryParam</text>
  <text x="140" y="382" text-anchor="middle" font-size="11" fill="#276749">HTML validated on load</text>
  <text x="140" y="399" text-anchor="middle" font-size="11" fill="#276749">DumpHTML() to debug</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a0aec0"/>
    </marker>
  </defs>

</svg>
